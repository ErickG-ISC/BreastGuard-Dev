name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Postgres real: las pruebas de aislamiento (RLS) no valen en SQLite
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # credencial efímera de CI, no es un secreto
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # tests/pgtest.py crea una base temporal aquí y fija el resto de variables (ficticias)
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:54329/postgres"
      # En CI, si Postgres no responde, las pruebas fallan en lugar de omitirse
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias (sin TensorFlow)
        run: |
          # tensorflow-cpu no se usa en las pruebas de esta fase y pesa ~500 MB
          grep -v '^tensorflow' requirements.txt > requirements-ci.txt
          sed 's/^-r requirements.txt$/-r requirements-ci.txt/' requirements-dev.txt > requirements-dev-ci.txt
          python -m pip install --upgrade pip
          pip install -r requirements-dev-ci.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Pytest
        run: pytest -q
