name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores ficticios: las pruebas usan SQLite en memoria y un doble de Storage
      DATABASE_URL: "sqlite://"
      SECRET_KEY: "clave-solo-para-ci"
      SUPABASE_URL: "http://localhost:54321"
      SUPABASE_KEY: "clave-falsa"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias (sin TensorFlow)
        run: |
          # tensorflow-cpu no se usa en las pruebas de esta fase y pesa ~500 MB
          grep -v '^tensorflow' requirements.txt > requirements-ci.txt
          sed 's/^-r requirements.txt$/-r requirements-ci.txt/' requirements-dev.txt > requirements-dev-ci.txt
          python -m pip install --upgrade pip
          pip install -r requirements-dev-ci.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Pytest
        run: pytest -q
