name: Auditoría de dependencias

# pip-audit y npm audit (ADR 0016). Workflow aparte: no lo marques como "required"; sirve para
# enterarse de vulnerabilidades NUEVAS (también corre cada lunes aunque nadie haga push).
# Las aceptadas están justificadas en docs/limitaciones-conocidas.md y se ignoran por id.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pip-audit (producción y desarrollo)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1
          # python-jose (GHSA-3qf3-8w2g-rqmx) y ecdsa (CVE-2024-23342): no aplican, ver
          # docs/limitaciones-conocidas.md (HS256 con algoritmo fijo; nunca se firma con ECDSA)
          pip-audit -r requirements-dev.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: npm audit (altas y críticas)
        run: npm audit --audit-level=high
