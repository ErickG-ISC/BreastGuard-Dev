# Configuración de Alembic. Ejecutar desde la raíz del repo:
#   alembic -c backend/alembic.ini upgrade head
# La URL de la base sale de DATABASE_URL (o de -x dburl=...), nunca de este archivo.

[alembic]
script_location = %(here)s/migrations
# Raíz del repo en sys.path para importar backend.app.*
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
