[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# main.py carga .env antes de importar el resto de la app
"backend/app/main.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# Dependencias de FastAPI en argumentos por defecto
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: usa el modelo exportado (BREASTGUARD_TEST_MODEL_DIR); se omite si no está",
]
