# Postgres local SOLO para pruebas y desarrollo. Nunca se usa contra Supabase.
#   docker compose up -d db
#   pytest -q        (usa TEST_DATABASE_URL; por defecto esta base en el puerto 54329)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # credencial local de pruebas, no es un secreto
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
